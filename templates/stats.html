{% extends "base.html" %}
{% block title %}Player Stats — Scorekeeper{% endblock %}

{% block nav_meta %}
<a href="/" class="btn btn--ghost btn--sm">← Home</a>
{% endblock %}

{% block content %}
<div class="page-hero">
  <h1 class="hero-title">Player Stats</h1>
  <p class="hero-sub">Win rates and history across all games.</p>
</div>

<section class="section">
  <div class="stats-grid" id="statsGrid">
    <div style="color:var(--text2);font-size:14px;">Loading stats...</div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
const BG_COLORS = ['#dde0e8','#dde4de','#e4dde4','#e4e0da','#dde8e4','#e8dde0','#e0e4e8','#e8e8de'];
const TC_COLORS = ['#4a5070','#4a6b50','#6a4a6a','#6a5a40','#3a6a60','#6a3a48','#3a5068','#5a5a38'];

async function loadStats() {
  const res = await fetch('/api/stats');
  const stats = await res.json();
  const grid = document.getElementById('statsGrid');
  if (!stats.length) { grid.innerHTML = '<div style="color:var(--text2);font-size:14px;">No games played yet!</div>'; return; }
  const sorted = stats.sort((a,b) => b.wins - a.wins);
  grid.innerHTML = sorted.map((s, i) => `
    <div class="stat-card">
      <div class="stat-avatar" style="background:${BG_COLORS[i%8]};color:${TC_COLORS[i%8]}">${s.name[0].toUpperCase()}</div>
      <div class="stat-name">${s.name}</div>
      <div class="stat-wins">${s.wins}</div>
      <div class="stat-meta">${s.wins === 1 ? 'win' : 'wins'} · ${s.games} ${s.games === 1 ? 'game' : 'games'}</div>
      <div class="stat-meta">avg ${s.games ? Math.round(s.total_score/s.games) : 0} pts/game</div>
    </div>`).join('');
}
loadStats();
</script>
{% endblock %}
