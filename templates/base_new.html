<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5a6e72" />
  <link rel="manifest" href="/manifest.json" />
  <title>{% block title %}Scorekeeper{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span class="nav-dot"></span>
      scorekeeper
    </a>
    <div class="nav-right">
      {% block nav_meta %}{% endblock %}
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
  </nav>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/score.js') }}"></script>
  <script>
    // Dark mode
    const saved = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️' : '🌙';
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
    }
    // PWA service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
